        <p class="eyebrow">我們樂意協助</p>
        <h1>應用程式支援</h1>
        <p class="lead">如需節奏練習、匯入樂譜、課程購買或還原購買方面的協助，請電郵至 <a href="mailto:__SUPPORT_EMAIL__">__SUPPORT_EMAIL__</a>。</p>

        <section>
          <h2>請提供的資料</h2>
          <p>請提供應用程式版本、裝置型號，以及問題發生時正在進行的操作。請勿提供密碼、付款資料或其他敏感資料。</p>
        </section>

        <section>
          <h2>分享診斷資料</h2>
          <p>你可以在結果頁匯出練習診斷檔並附在電郵中。檔案可能包含練習設定、系統生成的音符、拍擊時間及準確度結果。請先檢查檔案內容，只在你同意分享時才傳送。</p>
        </section>

        <section>
          <h2>私隱</h2>
          <p>請參閱<a href="../../privacy/">私隱政策</a>，了解應用程式如何處理資料。</p>
        </section>
