name: TestFlight

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Test, archive, and upload
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Audit App Store Connect setup
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: node scripts/audit-app-store-connect.mjs

      - name: Archive and upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          SPLITBEAT_MIN_FREE_SPACE_GIB: 5
        run: |
          if [[ -z "$ASC_API_KEY_ID" || -z "$ASC_API_ISSUER_ID" || -z "$ASC_API_KEY_P8" ]]; then
            echo "Set ASC_API_KEY_ID, ASC_API_ISSUER_ID, and ASC_API_KEY_P8 in repository Actions secrets." >&2
            exit 1
          fi

          key_path="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          trap 'rm -f "$key_path"' EXIT
          unset ASC_API_KEY_P8

          # Keep build numbers ordered by workflow run and unique on reruns.
          run_number="$GITHUB_RUN_NUMBER"
          run_attempt="$GITHUB_RUN_ATTEMPT"
          if [[ ! "$run_number" =~ ^[1-9][0-9]*$ || ! "$run_attempt" =~ ^[1-9][0-9]*$ || "$run_attempt" -gt 99 ]]; then
            echo "GitHub returned an invalid run number or attempt." >&2
            exit 1
          fi
          major=$((16 + (run_number - 1) / 99))
          minor=$(((run_number - 1) % 99 + 1))
          build_number="${major}.${minor}.${run_attempt}"

          echo "Using Xcode $(xcodebuild -version | tr '\n' ' ') for build $build_number."
          ASC_API_KEY_PATH="$key_path" \
            SPLITBEAT_BUILD_NUMBER="$build_number" \
            npm run release:testflight
