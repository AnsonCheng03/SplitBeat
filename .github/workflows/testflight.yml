name: TestFlight

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Test, archive, and upload
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Audit App Store Connect setup
        env:
          ASC_API_KEY_ID: \${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: \${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: \${{ secrets.ASC_API_KEY_P8 }}
        run: node scripts/audit-app-store-connect.mjs

      - name: Archive and upload to TestFlight
        env:
          ASC_API_KEY_ID: \${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: \${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: \${{ secrets.ASC_API_KEY_P8 }}
          SPLITBEAT_MIN_FREE_SPACE_GIB: 5
        run: |
          if [[ -z "$ASC_API_KEY_ID" || -z "$ASC_API_ISSUER_ID" || -z "$ASC_API_KEY_P8" ]]; then
            echo "Set ASC_API_KEY_ID, ASC_API_ISSUER_ID, and ASC_API_KEY_P8 in repository Actions secrets." >&2
            exit 1
          fi

          key_path="$RUNNER_TEMP/AuthKey_\${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"

          # Hermes is fetched by CocoaPods from Maven Central. Force curl to
          # HTTP/1.1 and retry transient transport errors; HTTP/2 downloads have
          # intermittently terminated before the Hermes archive finished.
          curl_config="$HOME/.curlrc"
          curl_config_backup="$RUNNER_TEMP/curlrc.backup"
          if [[ -f "$curl_config" ]]; then
            cp "$curl_config" "$curl_config_backup"
          fi
          cat >> "$curl_config" <<'CURLRC'
          http1.1
          retry = 5
          retry-all-errors
          retry-delay = 2
          retry-max-time = 900
          CURLRC
          restore_release_credentials() {
            rm -f "$key_path"
            if [[ -f "$curl_config_backup" ]]; then
              mv "$curl_config_backup" "$curl_config"
            else
              rm -f "$curl_config"
            fi
          }
          trap restore_release_credentials EXIT
          unset ASC_API_KEY_P8

          echo "Using Xcode $(xcodebuild -version | tr '\n' ' ') for the timestamp-numbered build."
          ASC_API_KEY_PATH="$key_path" \
            npm run release:testflight
