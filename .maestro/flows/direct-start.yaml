appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: Open
    commands:
      - tapOn: Open
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: home.audioStatus
    timeout: 15000
- assertVisible:
    id: home.start
- tapOn:
    id: home.start
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- assertVisible:
    id: practice.tutorial
- tapOn:
    id: practice.tutorial
- assertVisible:
    id: practice.beatCounter
- extendedWaitUntil:
    visible:
      id: practice.rhythmDisplay
    timeout: 10000
- tapOn:
    id: practice.pause
- assertVisible:
    id: practice.pauseMenu
- tapOn:
    id: practice.pause.finish
- extendedWaitUntil:
    visible:
      id: results.screen
    timeout: 15000
- assertVisible: SESSION COMPLETE
