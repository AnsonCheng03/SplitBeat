appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: Two-Hand Rhythm Trainer
    commands:
      - tapOn: Two-Hand Rhythm Trainer
- runFlow:
    when:
      visible:
        text: Open
    commands:
      - tapOn: Open
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: home.audioStatus
    timeout: 15000
- assertVisible:
    id: home.start
- tapOn:
    id: home.start
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- assertVisible:
    id: practice.tutorial
- extendedWaitUntil:
    visible:
      id: practice.rhythmDisplay
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: practice.rhythmNote.left.ready
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: practice.rhythmNote.right.ready
    timeout: 15000
- assertNotVisible:
    id: practice.nextPattern
- takeScreenshot: practice-intro
- tapOn:
    id: practice.tutorial
- assertVisible:
    id: practice.beatCounter
- extendedWaitUntil:
    visible:
      id: practice.rhythmDisplay
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: practice.rhythmNote.left.ready
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: practice.rhythmNote.right.ready
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: practice-active-display
- tapOn:
    id: practice.pause
- assertVisible: PAUSED
- tapOn:
    id: practice.pause.finish
- extendedWaitUntil:
    visible:
      id: results.screen
    timeout: 15000
- assertVisible: SESSION COMPLETE
