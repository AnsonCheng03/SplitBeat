appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: Two-Hand Rhythm Trainer
    commands:
      - tapOn: Two-Hand Rhythm Trainer
- runFlow:
    when:
      visible:
        text: Open
    commands:
      - tapOn: Open
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: tutorial.overlay
    timeout: 15000
- longPressOn:
    id: tutorial.holdToSkip
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- tapOn:
    id: home.start
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- assertVisible:
    id: practice.tutorial
- tapOn:
    id: practice.tutorial
- extendedWaitUntil:
    visible:
      id: practice.rhythmDisplay
    timeout: 10000
- tapOn:
    id: practice.pause
- assertVisible: PAUSED
- tapOn:
    id: practice.pause.finish
- extendedWaitUntil:
    visible:
      id: results.screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: results.startAgain
    direction: DOWN
- tapOn:
    id: results.startAgain
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- assertVisible:
    id: practice.tutorial
- assertNotVisible:
    id: results.screen
- tapOn:
    id: practice.tutorial
- extendedWaitUntil:
    visible:
      id: practice.rhythmDisplay
    timeout: 10000
