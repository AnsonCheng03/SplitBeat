appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- tapOn:
    id: home.setup
- assertVisible:
    id: setup.screen
- scrollUntilVisible:
    element:
      id: setup.card.rhythm
    direction: DOWN
- tapOn:
    id: setup.card.rhythm
- assertVisible:
    id: settings.rhythm.screen
- scrollUntilVisible:
    element:
      id: setup.mixture.note.dottedEighth
    direction: DOWN
- assertVisible:
    id: setup.mixture.note.dottedEighth
- tapOn:
    id: setup.mixture.note.dottedEighth
- scrollUntilVisible:
    element:
      id: setup.mixture.note.sixteenth
    direction: DOWN
- tapOn:
    id: setup.mixture.note.sixteenth
- scrollUntilVisible:
    element:
      id: setup.mixture.includeRests
    direction: DOWN
- tapOn:
    id: setup.mixture.includeRests
- assertVisible:
    id: setup.mixture.note.sixteenth
- scrollUntilVisible:
    element:
      id: settings.rhythm.back
    direction: UP
    visibilityPercentage: 90
- tapOn:
    id: settings.rhythm.back
- assertVisible:
    id: setup.start
