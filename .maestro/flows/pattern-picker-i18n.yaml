appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: tutorial.overlay
    timeout: 15000
- longPressOn:
    id: tutorial.holdToSkip
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- tapOn:
    id: home.setup
- tapOn:
    id: setup.card.language
- tapOn:
    id: settings.language.choice.zh-Hant
- assertVisible: 語言
- tapOn:
    id: settings.language.back
- tapOn:
    id: setup.home
- tapOn:
    id: home.activityPicker
- waitForAnimationToEnd
- tapOn:
    id: home.exercise
- waitForAnimationToEnd
- tapOn:
    id: home.start
- extendedWaitUntil:
    visible:
      id: exercise.screen
    timeout: 15000
- tapOn:
    id: exercise.tab.pair
- scrollUntilVisible:
    element:
      id: exercise.pair.left.quarter
    direction: DOWN
- assertVisible:
    id: exercise.pair.left.quarter
- assertVisible:
    id: exercise.pair.left.eighth
- assertVisible:
    id: exercise.pair.right.quarter
- assertVisible:
    id: exercise.pair.right.eighth
- takeScreenshot: pattern-picker-note-symbols-zh-Hant
- scrollUntilVisible:
    element:
      id: exercise.pair.left.rest
    direction: DOWN
- assertVisible:
    id: exercise.pair.left.sixteenth
- assertVisible:
    id: exercise.pair.left.thirtySecond
- assertNotVisible:
    id: exercise.pair.left.sixtyFourth
- assertVisible:
    id: exercise.pair.left.duplet
- assertVisible:
    id: exercise.pair.left.triplet
- assertVisible:
    id: exercise.pair.left.quadruplet
- assertVisible:
    id: exercise.pair.left.quintuplet
- assertVisible:
    id: exercise.pair.left.sextuplet
- assertVisible:
    id: exercise.pair.left.septuplet
- assertVisible:
    id: exercise.pair.left.octuplet
- assertVisible:
    id: exercise.pair.left.nonuplet
- assertVisible:
    id: exercise.pair.left.rest
- assertNotVisible:
    id: exercise.pair.right.sixtyFourth
- assertVisible:
    id: exercise.pair.right.nonuplet
- assertVisible:
    id: exercise.pair.right.rest
- takeScreenshot: pattern-picker-all-note-symbols
