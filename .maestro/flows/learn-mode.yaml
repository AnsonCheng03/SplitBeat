appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: Two-Hand Rhythm Trainer
    commands:
      - tapOn: Two-Hand Rhythm Trainer
- runFlow:
    when:
      visible:
        text: Open
    commands:
      - tapOn: Open
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- tapOn:
    id: home.learn
- extendedWaitUntil:
    visible:
      id: learn.screen
    timeout: 15000
- assertVisible:
    id: learn.restore
- scrollUntilVisible:
    element: { id: learn.start }
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: learn.start
    timeout: 15000
- assertVisible:
    id: learn.start
- assertVisible: Find the pulse
- assertVisible:
    id: learn.progress.count
- assertVisible:
    id: learn.lesson.together-pulse
- swipe:
    start: 85%, 80%
    end: 85%, 35%
    duration: 400
- tapOn:
    id: learn.lesson.triplet-spacing
- assertVisible:
    id: learn.purchase.offer
- scrollUntilVisible:
    element: { id: learn.purchase }
    direction: DOWN
- assertVisible:
    id: learn.purchase
- swipe:
    start: 85%, 35%
    end: 85%, 80%
    duration: 400
- tapOn:
    id: learn.lesson.steady-pulse
- scrollUntilVisible:
    element: { id: learn.start }
    direction: UP
- tapOn:
    id: learn.start
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- assertVisible:
    id: practice.tutorial
- tapOn:
    id: practice.tutorial
- assertVisible:
    id: practice.beatCounter
- tapOn:
    id: practice.pause
- assertVisible:
    id: practice.pauseMenu
- tapOn:
    id: practice.pause.finish
- extendedWaitUntil:
    visible:
      id: results.screen
    timeout: 15000
- assertVisible: LESSON COMPLETE
- assertVisible:
    id: results.lessonRating
- assertVisible:
    id: results.lessonStars
- scrollUntilVisible:
    element:
      id: results.continueLearning
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: results.continueLearning
    timeout: 15000
- tapOn:
    id: results.continueLearning
- extendedWaitUntil:
    visible:
      id: learn.screen
    timeout: 15000
- assertVisible: 1 / 20
- assertVisible:
    id: learn.progress.stars
- assertVisible:
    id: learn.lesson.together-pulse
- assertVisible:
    id: learn.rating.steady-pulse
