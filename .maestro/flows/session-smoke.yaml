appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: Open
    commands:
      - tapOn: Open
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: AUDIO READY
    timeout: 15000
- tapOn:
    id: home.setup
- assertVisible:
    id: setup.screen
- scrollUntilVisible:
    element:
      id: setup.timeSignature.6-8
    direction: DOWN
- tapOn:
    id: setup.timeSignature.6-8
- scrollUntilVisible:
    element:
      id: setup.feel.swing
    direction: DOWN
- tapOn:
    id: setup.feel.swing
- scrollUntilVisible:
    element:
      id: setup.subdivision.thirtySecond
    direction: DOWN
- assertVisible:
    id: setup.subdivision.thirtySecond
- assertVisible:
    id: setup.subdivision.sixtyFourth
- tapOn:
    id: setup.subdivision.thirtySecond
- tapOn:
    id: setup.subdivision.sixtyFourth
- scrollUntilVisible:
    element:
      id: setup.calibration.reset
    direction: DOWN
- tapOn:
    id: setup.calibration.reset
- scrollUntilVisible:
    element:
      id: setup.calibration.open
    direction: UP
    visibilityPercentage: 90
- tapOn:
    id: setup.calibration.open
- assertVisible:
    id: calibration.start
- tapOn:
    id: calibration.close
- waitForAnimationToEnd
- swipe:
    start: 90%, 90%
    end: 90%, 20%
    duration: 500
- assertVisible:
    id: setup.sound.metronome.bell
- tapOn:
    id: setup.sound.metronome.bell
- scrollUntilVisible:
    element:
      id: setup.sound.left.wood
    direction: DOWN
- tapOn:
    id: setup.sound.left.wood
- scrollUntilVisible:
    element:
      id: setup.sound.right.soft
    direction: DOWN
- tapOn:
    id: setup.sound.right.soft
- scrollUntilVisible:
    element:
      id: setup.toggle.graceNotes
    direction: DOWN
- tapOn:
    id: setup.toggle.graceNotes
- scrollUntilVisible:
    element:
      id: setup.start
    direction: DOWN
- extendedWaitUntil:
    visible:
      text: AUDIO READY
    timeout: 15000
- tapOn:
    id: setup.start
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- assertVisible:
    id: practice.timeSignature
- assertVisible: 6/8
- assertVisible: SWING
- extendedWaitUntil:
    visible:
      id: practice.nextPattern
    timeout: 15000
- assertVisible:
    id: practice.gracePreview
- assertVisible:
    id: practice.tap.left
- assertVisible:
    id: practice.tap.right
- assertVisible:
    id: practice.keyboard.leftKeys
- assertVisible:
    id: practice.keyboard.rightKeys
- tapOn:
    id: practice.tap.left
- tapOn:
    id: practice.tap.right
- tapOn:
    id: practice.end
- extendedWaitUntil:
    visible:
      id: results.screen
    timeout: 15000
- assertVisible: SESSION COMPLETE
