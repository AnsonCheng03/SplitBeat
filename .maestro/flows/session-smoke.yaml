appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: Two-Hand Rhythm Trainer
    commands:
      - tapOn: Two-Hand Rhythm Trainer
- runFlow:
    when:
      visible:
        text: Open
    commands:
      - tapOn: Open
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: home.audioStatus
    timeout: 15000
- assertVisible:
    id: home.start
- tapOn:
    id: home.records
- assertVisible:
    id: records.screen
- tapOn:
    id: records.home
- assertVisible:
    id: home.start
- tapOn:
    id: home.mode.singleHand
- tapOn:
    id: home.setup
- assertVisible:
    id: setup.screen
- scrollUntilVisible:
    element: { id: setup.card.rhythm }
    direction: DOWN
- swipe:
    start: 90%, 70%
    end: 90%, 45%
    duration: 350
- tapOn:
    id: setup.card.rhythm
- assertVisible:
    id: settings.rhythm.screen
- scrollUntilVisible:
    element:
      id: setup.timeSignature.6-8
    direction: DOWN
- tapOn:
    id: setup.timeSignature.6-8
- scrollUntilVisible:
    element:
      id: setup.feel.swing
    direction: DOWN
- tapOn:
    id: setup.feel.swing
- scrollUntilVisible:
    element:
      id: setup.subdivision.thirtySecond
    direction: DOWN
- assertVisible:
    id: setup.subdivision.thirtySecond
- tapOn:
    id: setup.subdivision.thirtySecond
- scrollUntilVisible:
    element:
      id: setup.subdivision.sixtyFourth
    direction: DOWN
- assertVisible:
    id: setup.subdivision.sixtyFourth
- tapOn:
    id: setup.subdivision.sixtyFourth
- scrollUntilVisible:
    element: { id: setup.toggle.graceNotes }
    direction: DOWN
- tapOn:
    id: setup.toggle.graceNotes
- scrollUntilVisible:
    element: { id: setup.toggle.restBetweenChanges }
    direction: DOWN
- tapOn:
    id: setup.toggle.restBetweenChanges
- scrollUntilVisible:
    element: { id: settings.rhythm.back }
    direction: UP
    visibilityPercentage: 90
- tapOn:
    id: settings.rhythm.back
- scrollUntilVisible:
    element: { id: setup.card.timing }
    direction: DOWN
- swipe:
    start: 90%, 70%
    end: 90%, 45%
    duration: 350
- tapOn:
    id: setup.card.timing
- assertVisible:
    id: settings.timing.screen
- scrollUntilVisible:
    element: { id: setup.calibration.reset }
    direction: DOWN
- swipe:
    start: 90%, 80%
    end: 90%, 35%
    duration: 500
- assertVisible:
    id: setup.calibration.reset
- tapOn:
    id: setup.calibration.reset
- scrollUntilVisible:
    element:
      id: setup.calibration.open
    direction: UP
    visibilityPercentage: 90
- tapOn:
    id: setup.calibration.open
- assertVisible:
    id: calibration.start
- tapOn:
    id: calibration.close
- waitForAnimationToEnd
- scrollUntilVisible:
    element: { id: settings.timing.back }
    direction: UP
    visibilityPercentage: 90
- tapOn:
    id: settings.timing.back
- scrollUntilVisible:
    element: { id: setup.card.audio }
    direction: DOWN
- swipe:
    start: 90%, 70%
    end: 90%, 45%
    duration: 350
- tapOn:
    id: setup.card.audio
- assertVisible:
    id: settings.audio.screen
- tapOn:
    id: setup.toggle.sound
- assertNotVisible:
    text: Sound on. Tap to mute.
- scrollUntilVisible:
    element: { id: setup.sound.metronome.bell }
    direction: DOWN
- assertVisible:
    id: setup.sound.metronome.bell
- tapOn:
    id: setup.sound.metronome.bell
- scrollUntilVisible:
    element:
      id: setup.sound.left.wood
    direction: DOWN
- tapOn:
    id: setup.sound.left.wood
- scrollUntilVisible:
    element:
      id: setup.sound.right.soft
    direction: DOWN
- tapOn:
    id: setup.sound.right.soft
- scrollUntilVisible:
    element: { id: settings.audio.back }
    direction: UP
    visibilityPercentage: 90
- tapOn:
    id: settings.audio.back
- assertVisible:
    id: setup.start
- tapOn:
    id: setup.start
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- assertVisible:
    id: practice.tutorial
- tapOn:
    id: practice.tutorial
- extendedWaitUntil:
    visible:
      id: practice.rhythmDisplay
    timeout: 10000
- assertVisible:
    id: practice.rhythmDisplay
- assertVisible:
    id: practice.beatCounter
- assertVisible:
    id: practice.nextPattern
- assertVisible:
    id: practice.nextPattern.countdown
- extendedWaitUntil:
    visible:
      id: practice.restBeat
    timeout: 10000
- assertVisible:
    id: practice.tap.single
- tapOn:
    id: practice.tap.single
- tapOn:
    id: practice.tap.single
- tapOn:
    id: practice.pause
- assertVisible:
    id: practice.pauseMenu
- tapOn:
    id: practice.pause.finish
- extendedWaitUntil:
    visible:
      id: results.screen
    timeout: 15000
- assertVisible: SESSION COMPLETE
- scrollUntilVisible:
    element:
      id: results.missedNotes
    direction: DOWN
- assertVisible:
    id: results.missedNotes
- assertNotVisible:
    id: results.missedBar.1
- tapOn:
    id: results.missedNotes
- scrollUntilVisible:
    element:
      id: results.replayBar.1
    direction: DOWN
- tapOn:
    id: results.replayBar.1
- assertVisible:
    id: results.replayTimeline.1
- assertVisible:
    id: results.screen
- scrollUntilVisible:
    element:
      id: results.breakdown
    direction: DOWN
- assertNotVisible:
    id: results.breakdown.details
- tapOn:
    id: results.breakdown
- scrollUntilVisible:
    element:
      id: results.breakdown.details
    direction: DOWN
- assertVisible:
    id: results.breakdown.details
- scrollUntilVisible:
    element:
      id: results.records
    direction: DOWN
- swipe:
    start: 90%, 80%
    end: 90%, 35%
    duration: 500
- tapOn:
    id: results.records
- assertVisible:
    id: records.screen
- assertVisible:
    id: records.count
