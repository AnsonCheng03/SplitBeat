appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: Open
    commands:
      - tapOn: Open
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: home.audioStatus
    timeout: 15000
- assertVisible:
    id: home.start
- tapOn:
    id: home.mode.singleHand
- tapOn:
    id: home.hand.right
- tapOn:
    id: home.setup
- assertVisible:
    id: setup.screen
- scrollUntilVisible:
    element: { id: setup.card.rhythm }
    direction: DOWN
- swipe:
    start: 90%, 70%
    end: 90%, 45%
    duration: 350
- tapOn:
    id: setup.card.rhythm
- assertVisible:
    id: settings.rhythm.screen
- scrollUntilVisible:
    element:
      id: setup.timeSignature.6-8
    direction: DOWN
- tapOn:
    id: setup.timeSignature.6-8
- scrollUntilVisible:
    element:
      id: setup.feel.swing
    direction: DOWN
- tapOn:
    id: setup.feel.swing
- scrollUntilVisible:
    element:
      id: setup.subdivision.thirtySecond
    direction: DOWN
- assertVisible:
    id: setup.subdivision.thirtySecond
- tapOn:
    id: setup.subdivision.thirtySecond
- scrollUntilVisible:
    element:
      id: setup.subdivision.sixtyFourth
    direction: DOWN
- assertVisible:
    id: setup.subdivision.sixtyFourth
- tapOn:
    id: setup.subdivision.sixtyFourth
- scrollUntilVisible:
    element: { id: setup.toggle.graceNotes }
    direction: DOWN
- tapOn:
    id: setup.toggle.graceNotes
- scrollUntilVisible:
    element: { id: setup.toggle.restBetweenChanges }
    direction: DOWN
- tapOn:
    id: setup.toggle.restBetweenChanges
- scrollUntilVisible:
    element: { id: settings.rhythm.back }
    direction: UP
    visibilityPercentage: 90
- tapOn:
    id: settings.rhythm.back
- scrollUntilVisible:
    element: { id: setup.card.timing }
    direction: DOWN
- swipe:
    start: 90%, 70%
    end: 90%, 45%
    duration: 350
- tapOn:
    id: setup.card.timing
- assertVisible:
    id: settings.timing.screen
- scrollUntilVisible:
    element: { id: setup.calibration.reset }
    direction: DOWN
- swipe:
    start: 90%, 80%
    end: 90%, 35%
    duration: 500
- assertVisible:
    id: setup.calibration.reset
- tapOn:
    id: setup.calibration.reset
- scrollUntilVisible:
    element:
      id: setup.calibration.open
    direction: UP
    visibilityPercentage: 90
- tapOn:
    id: setup.calibration.open
- assertVisible:
    id: calibration.start
- tapOn:
    id: calibration.close
- waitForAnimationToEnd
- scrollUntilVisible:
    element: { id: settings.timing.back }
    direction: UP
    visibilityPercentage: 90
- tapOn:
    id: settings.timing.back
- scrollUntilVisible:
    element: { id: setup.card.audio }
    direction: DOWN
- swipe:
    start: 90%, 70%
    end: 90%, 45%
    duration: 350
- tapOn:
    id: setup.card.audio
- assertVisible:
    id: settings.audio.screen
- assertVisible:
    id: setup.sound.metronome.bell
- tapOn:
    id: setup.sound.metronome.bell
- scrollUntilVisible:
    element:
      id: setup.sound.left.wood
    direction: DOWN
- tapOn:
    id: setup.sound.left.wood
- scrollUntilVisible:
    element:
      id: setup.sound.right.soft
    direction: DOWN
- tapOn:
    id: setup.sound.right.soft
- scrollUntilVisible:
    element: { id: settings.audio.back }
    direction: UP
    visibilityPercentage: 90
- tapOn:
    id: settings.audio.back
- scrollUntilVisible:
    element: { id: setup.card.display }
    direction: DOWN
- swipe:
    start: 90%, 70%
    end: 90%, 45%
    duration: 350
- tapOn:
    id: setup.card.display
- assertVisible:
    id: settings.display.screen
- tapOn:
    id: setup.display.piano-staff
- tapOn:
    id: settings.display.back
- assertVisible:
    id: setup.start
- tapOn:
    id: setup.start
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- assertVisible:
    id: practice.grandStaff
- assertVisible:
    id: practice.grandStaff.treble
- assertVisible:
    id: practice.grandStaff.bass
- assertVisible: RIGHT HAND ONLY
- assertVisible: Sound on. Tap to mute.
- tapOn:
    id: practice.soundToggle
- assertVisible: Sound off. Tap to enable.
- assertVisible: "SOUND OFF · TAP TO ENABLE"
- tapOn:
    id: practice.soundToggle
- assertVisible: Sound on. Tap to mute.
- assertVisible:
    id: practice.timeSignature
- assertVisible: 6/8
- assertVisible: SWING
- extendedWaitUntil:
    visible:
      id: practice.nextPattern
    timeout: 15000
- assertVisible:
    id: practice.nextPattern.countdown
- extendedWaitUntil:
    visible:
      id: practice.restBeat
    timeout: 10000
- assertVisible:
    id: practice.tap.left
- assertVisible:
    id: practice.tap.right
- assertVisible:
    id: practice.keyboard.leftKeys
- assertVisible:
    id: practice.keyboard.rightKeys
- tapOn:
    id: practice.tap.left
- tapOn:
    id: practice.tap.right
- tapOn:
    id: practice.end
- extendedWaitUntil:
    visible:
      id: results.screen
    timeout: 15000
- assertVisible: SESSION COMPLETE
