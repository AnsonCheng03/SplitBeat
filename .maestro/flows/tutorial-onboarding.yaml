appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: Two-Hand Rhythm Trainer
    commands:
      - tapOn: Two-Hand Rhythm Trainer
- runFlow:
    when:
      visible:
        text: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible:
      id: tutorial.overlay
    timeout: 15000
- assertVisible:
    id: tutorial.title
    text: NOTE VIEW
- assertVisible:
    id: tutorial.beatCount
    text: Beat 1 of 4
- assertVisible:
    id: tutorial.notation.note
- tapOn:
    id: tutorial.tapRight
- assertVisible:
    id: tutorial.feedback
    text: That was the other hand. Start this bar again from beat one.
- assertVisible:
    id: tutorial.beatCount
    text: Beat 1 of 4
- tapOn:
    id: tutorial.tapLeft
- assertVisible:
    id: tutorial.hint
    text: 'Beat 2: tap the right side.'
- tapOn:
    id: tutorial.tapRight
- tapOn:
    id: tutorial.tapLeft
- tapOn:
    id: tutorial.tapRight
- assertVisible:
    id: tutorial.title
    text: BAR VIEW
- assertVisible:
    id: tutorial.notation.bar
- assertVisible:
    id: tutorial.barBeat.1
- assertVisible:
    id: tutorial.barBeat.2
- assertVisible:
    id: tutorial.barBeat.3
- assertVisible:
    id: tutorial.barBeat.4
- tapOn:
    id: tutorial.startBarView
- assertVisible:
    id: tutorial.beatCount
    text: Beat 1 of 4
- tapOn:
    id: tutorial.tapLeft
- assertVisible:
    id: tutorial.beatCount
    text: Beat 2 of 4
- tapOn:
    id: tutorial.tapRight
- tapOn:
    id: tutorial.tapLeft
- tapOn:
    id: tutorial.tapRight
- assertVisible:
    id: tutorial.title
    text: Tutorial complete
- tapOn:
    id: tutorial.done
- assertNotVisible:
    id: tutorial.overlay
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
