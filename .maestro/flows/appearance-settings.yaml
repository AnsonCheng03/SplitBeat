appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: tutorial.overlay
    timeout: 15000
- longPressOn:
    id: tutorial.holdToSkip
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- tapOn:
    id: home.setup
- assertVisible:
    id: setup.screen
- scrollUntilVisible:
    element:
      id: setup.card.appearance
    direction: DOWN
- tapOn:
    id: setup.card.appearance
- assertVisible:
    id: settings.appearance.screen
- scrollUntilVisible:
    element:
      id: settings.appearance.lightMode
    direction: UP
- tapOn:
    id: settings.appearance.lightMode
- scrollUntilVisible:
    element:
      id: settings.appearance.back
    direction: UP
- tapOn:
    id: settings.appearance.back
- assertVisible:
    id: setup.screen
- tapOn:
    id: setup.home
- assertVisible:
    id: home.screen
- tapOn:
    id: home.display.score
- assertVisible:
    id: home.display.score
    selected: true
- assertVisible:
    id: home.scoreDisplay.fade
    selected: true
- tapOn:
    id: home.scoreDisplay.slide-per-note
- assertVisible:
    id: home.scoreDisplay.slide-per-note
    selected: true
- tapOn:
    id: home.start
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- tapOn:
    id: practice.tutorial
- extendedWaitUntil:
    visible:
      id: practice.scoreMeasure.viewport
    timeout: 10000
- assertVisible:
    id: practice.scoreBackground
- assertVisible:
    id: practice.scoreMeasure.slot.0.bar.0
