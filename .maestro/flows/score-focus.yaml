appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: Two-Hand Rhythm Trainer
    commands:
      - tapOn: Two-Hand Rhythm Trainer
- runFlow:
    when:
      visible:
        text: Open
    commands:
      - tapOn: Open
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: tutorial.overlay
    timeout: 15000
- longPressOn:
    id: tutorial.holdToSkip
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- tapOn:
    id: home.setup
- assertVisible:
    id: setup.screen
- scrollUntilVisible:
    element:
      id: setup.card.appearance
    direction: DOWN
- tapOn:
    id: setup.card.appearance
- assertVisible:
    id: settings.appearance.screen
- scrollUntilVisible:
    element:
      id: settings.appearance.scoreDisplay.focus
    direction: DOWN
- tapOn:
    id: settings.appearance.scoreDisplay.focus
- assertVisible:
    id: settings.appearance.scoreDisplay.focus
    selected: true
- scrollUntilVisible:
    element:
      id: settings.appearance.back
    direction: UP
- tapOn:
    id: settings.appearance.back
- assertVisible:
    id: setup.screen
- tapOn:
    id: setup.home
- assertVisible:
    id: home.screen
- tapOn:
    id: home.activityPicker
- waitForAnimationToEnd
- tapOn:
    id: home.importScore
- waitForAnimationToEnd
- tapOn:
    id: home.start
- waitForAnimationToEnd
- assertVisible:
    id: scoreImport.screen
- tapOn:
    id: scoreImport.loadSample
- assertVisible:
    id: scoreImport.summary
- scrollUntilVisible:
    element: { id: scoreImport.start }
    direction: DOWN
- tapOn:
    id: scoreImport.start
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- tapOn:
    id: practice.tutorial
- extendedWaitUntil:
    visible:
      id: practice.scoreBeat.left
    timeout: 10000
- assertVisible:
    id: practice.scoreBeat.left.notation
- assertVisible:
    id: practice.scoreBeat.right
- assertVisible:
    id: practice.scoreBeat.right.notation
- extendedWaitUntil:
    visible: "1 bar remaining"
    timeout: 15000
- tapOn:
    id: practice.pause
- assertVisible: PAUSED
- tapOn:
    id: practice.pause.finish
- extendedWaitUntil:
    visible:
      id: results.screen
    timeout: 15000
- assertVisible: SCORE SESSION COMPLETE
