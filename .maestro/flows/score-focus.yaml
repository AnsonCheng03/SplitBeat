appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: Two-Hand Rhythm Trainer
    commands:
      - tapOn: Two-Hand Rhythm Trainer
- runFlow:
    when:
      visible:
        text: Open
    commands:
      - tapOn: Open
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: tutorial.overlay
    timeout: 15000
- tapOn:
    id: tutorial.skip
- tapOn:
    id: home.activityPicker
- tapOn:
    id: home.importScore
- assertVisible:
    id: scoreImport.screen
- tapOn:
    id: scoreImport.loadSample
- assertVisible:
    id: scoreImport.summary
- scrollUntilVisible:
    element: { id: scoreImport.display.focus }
    direction: DOWN
- tapOn:
    id: scoreImport.display.focus
- scrollUntilVisible:
    element: { id: scoreImport.start }
    direction: DOWN
- tapOn:
    id: scoreImport.start
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- tapOn:
    id: practice.tutorial
- extendedWaitUntil:
    visible:
      id: practice.scoreBeat.left
    timeout: 10000
- assertVisible:
    id: practice.scoreBeat.left.notation
- assertVisible:
    id: practice.scoreBeat.right
- assertVisible:
    id: practice.scoreBeat.right.notation
- extendedWaitUntil:
    visible: "1 bar remaining"
    timeout: 15000
- assertVisible: REST
- tapOn:
    id: practice.pause
- assertVisible: PAUSED
- tapOn:
    id: practice.pause.finish
- extendedWaitUntil:
    visible:
      id: results.screen
    timeout: 15000
- assertVisible: SCORE SESSION COMPLETE
