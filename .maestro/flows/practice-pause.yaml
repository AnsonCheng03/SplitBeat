appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: Two-Hand Rhythm Trainer
    commands:
      - tapOn: Two-Hand Rhythm Trainer
- runFlow:
    when:
      visible:
        text: Open
    commands:
      - tapOn: Open
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- tapOn:
    id: home.start
- extendedWaitUntil:
    visible:
      id: practice.tutorial
    timeout: 15000
- tapOn:
    id: practice.tutorial
- extendedWaitUntil:
    visible:
      id: practice.rhythmDisplay
    timeout: 10000
- tapOn:
    id: practice.pause
- assertVisible: PAUSED
- assertVisible:
    id: practice.pause.continue
- assertVisible:
    id: practice.pause.bpmSlider
- tapOn:
    id: practice.pause.bpmPlus
- assertVisible:
    id: practice.pause.applyBpm
- tapOn:
    id: practice.pause.applyBpm
- assertNotVisible: PAUSED
- extendedWaitUntil:
    visible:
      id: practice.rhythmDisplay
    timeout: 10000
- tapOn:
    id: practice.pause
- assertVisible: PAUSED
- tapOn:
    id: practice.pause.liveSettings
- assertNotVisible:
    id: practice.pauseMenu
- assertVisible:
    id: practice.liveSettings
- assertVisible:
    id: practice.liveSettings.sound
- scrollUntilVisible:
    element:
      id: practice.liveSettings.haptics
    direction: DOWN
- assertVisible:
    id: practice.liveSettings.haptics
- scrollUntilVisible:
    element:
      id: practice.liveSettings.back
    direction: UP
- tapOn:
    id: practice.liveSettings.back
- assertVisible: PAUSED
- tapOn:
    id: practice.pause.continue
- assertNotVisible: PAUSED
- extendedWaitUntil:
    notVisible:
      id: practice.resumeCountIn
    timeout: 10000
- tapOn:
    id: practice.pause
- assertVisible: PAUSED
- tapOn:
    id: practice.pause.home
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
