appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- tapOn:
    id: home.importScore
- assertVisible:
    id: scoreImport.screen
- tapOn:
    id: scoreImport.xmlInput
- inputText: '<score-partwise><work><work-title>E2E Two Bar Score</work-title></work><part-list><score-part id="P"><part-name>Piano</part-name></score-part></part-list><part id="P"><measure number="1"><attributes><divisions>24</divisions><staves>2</staves><time><beats>2</beats><beat-type>4</beat-type></time></attributes><note><duration>48</duration><staff>1</staff></note><backup><duration>48</duration></backup><note><duration>48</duration><staff>2</staff></note></measure><measure number="2"><note><duration>48</duration><staff>1</staff></note><backup><duration>48</duration></backup><note><duration>48</duration><staff>2</staff></note></measure></part></score-partwise>'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: scoreImport.parse
    direction: DOWN
- tapOn:
    id: scoreImport.parse
- assertVisible:
    id: scoreImport.summary
- assertVisible: E2E Two Bar Score
- assertVisible: 2 left-hand notes · 2 right-hand notes
- tapOn:
    id: scoreImport.duration.30
- scrollUntilVisible:
    element:
      id: scoreImport.start
    direction: DOWN
- tapOn:
    id: scoreImport.start
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- assertVisible:
    id: practice.tutorial
- tapOn:
    id: practice.tutorial
- extendedWaitUntil:
    visible:
      id: practice.rhythmDisplay
    timeout: 10000
- assertVisible:
    id: practice.scoreMeasure
- assertVisible:
    id: practice.scoreMeasure.leftNotation
- assertVisible:
    id: practice.scoreMeasure.rightNotation
- tapOn:
    id: practice.tap.left
- tapOn:
    id: practice.tap.right
- tapOn:
    id: practice.end
- extendedWaitUntil:
    visible:
      id: results.screen
    timeout: 15000
- assertVisible: SCORE SESSION COMPLETE
- assertVisible: 80 BPM · 2/4 · E2E Two Bar Score
