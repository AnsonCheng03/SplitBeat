appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: Two-Hand Rhythm Trainer
    commands:
      - tapOn: Two-Hand Rhythm Trainer
- runFlow:
    when:
      visible:
        text: Open
    commands:
      - tapOn: Open
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- tapOn:
    id: home.importScore
- assertVisible:
    id: scoreImport.screen
- assertVisible:
    id: scoreImport.import
- assertVisible:
    id: scoreImport.loadSample
- tapOn:
    id: scoreImport.loadSample
- assertVisible:
    id: scoreImport.summary
- assertVisible: E2E Two Bar Score
- assertVisible: 2 left-hand notes · 2 right-hand notes
- tapOn:
    id: scoreImport.duration.30
- scrollUntilVisible:
    element:
      id: scoreImport.start
    direction: DOWN
- tapOn:
    id: scoreImport.start
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- assertVisible:
    id: practice.tutorial
- tapOn:
    id: practice.tutorial
- extendedWaitUntil:
    visible:
      id: practice.rhythmDisplay
    timeout: 10000
- assertVisible:
    id: practice.scoreMeasure
- assertVisible:
    id: practice.scoreMeasure.leftNotation
- assertVisible:
    id: practice.scoreMeasure.rightNotation
- tapOn:
    id: practice.tap.left
- tapOn:
    id: practice.tap.right
- tapOn:
    id: practice.end
- extendedWaitUntil:
    visible:
      id: results.screen
    timeout: 15000
- assertVisible: SCORE SESSION COMPLETE
- assertVisible: 80 BPM · 2/4 · E2E Two Bar Score
