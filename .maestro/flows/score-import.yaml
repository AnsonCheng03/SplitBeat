appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: Two-Hand Rhythm Trainer
    commands:
      - tapOn: Two-Hand Rhythm Trainer
- runFlow:
    when:
      visible:
        text: Open
    commands:
      - tapOn: Open
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: tutorial.overlay
    timeout: 15000
- tapOn:
    id: tutorial.skip
- tapOn:
    id: home.activityPicker
- tapOn:
    id: home.importScore
- tapOn:
    id: home.start
- assertVisible:
    id: scoreImport.screen
- assertVisible:
    id: scoreImport.import
- assertVisible:
    id: scoreImport.loadSample
- tapOn:
    id: scoreImport.loadSample
- assertVisible:
    id: scoreImport.summary
- assertVisible: 2 tracks · two hands · 4 bars · 4/4 · 60 BPM
- assertVisible: E2E Mixed Rhythm
- assertVisible: 33 left-hand notes · 46 right-hand notes
- scrollUntilVisible:
    element: { id: scoreImport.display.fade }
    direction: DOWN
- assertVisible:
    id: scoreImport.display.slide
- assertVisible:
    id: scoreImport.display.fade
- assertVisible:
    id: scoreImport.display.slide-per-note
- assertVisible:
    id: scoreImport.display.focus
- assertVisible:
    id: scoreImport.display.fade
    selected: true
- takeScreenshot: imported-score-preview-default
- tapOn:
    id: scoreImport.display.slide
- assertVisible:
    id: scoreImport.display.slide
    selected: true
- tapOn:
    id: scoreImport.display.fade
- assertVisible:
    id: scoreImport.display.fade
    selected: true
- assertVisible: left bar with 10 notes and 1 rest
- takeScreenshot: imported-score-preview
- scrollUntilVisible:
    element:
      id: scoreImport.start
    direction: DOWN
- tapOn:
    id: scoreImport.start
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- assertVisible:
    id: practice.tutorial
- tapOn:
    id: practice.tutorial
- extendedWaitUntil:
    visible:
      id: practice.rhythmDisplay
    timeout: 10000
- assertVisible:
    id: practice.barsRemaining
- assertVisible:
    id: practice.scoreMeasure
- assertVisible:
    id: practice.scoreMeasure.barline.0
- assertVisible:
    id: practice.scoreMeasure.barline.1
- assertVisible:
    id: practice.scoreMeasure.bar.0.leftNotation
- assertVisible:
    id: practice.scoreMeasure.bar.0.rightNotation
- takeScreenshot: practice-score-combinations
- assertVisible:
    id: practice.tap.left.label
- assertVisible:
    id: practice.tap.right.label
- assertNotVisible:
    id: practice.scoreHand.left
- tapOn:
    id: practice.tap.left
- tapOn:
    id: practice.tap.right
- extendedWaitUntil:
    visible: "1 bar remaining"
    timeout: 15000
- tapOn:
    id: practice.pause
- assertVisible: PAUSED
- assertVisible: 1 BAR BACK
- tapOn:
    id: practice.pause.rewind
- assertNotVisible: PAUSED
- extendedWaitUntil:
    visible:
      id: results.screen
    timeout: 15000
- assertVisible: SCORE SESSION COMPLETE
- assertVisible: 60 BPM · 4/4 · E2E Mixed Rhythm
