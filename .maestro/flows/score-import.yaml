appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: Two-Hand Rhythm Trainer
    commands:
      - tapOn: Two-Hand Rhythm Trainer
- runFlow:
    when:
      visible:
        text: Open
    commands:
      - tapOn: Open
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- tapOn:
    id: home.importScore
- assertVisible:
    id: scoreImport.screen
- assertVisible:
    id: scoreImport.import
- assertVisible:
    id: scoreImport.loadSample
- tapOn:
    id: scoreImport.loadSample
- assertVisible:
    id: scoreImport.summary
- assertVisible: E2E Two Bar Score
- assertVisible: 4 left-hand notes · 4 right-hand notes
- scrollUntilVisible:
    element: { id: scoreImport.display.staff }
    direction: DOWN
- assertVisible:
    id: scoreImport.display.staff
- assertVisible:
    id: scoreImport.display.focus
- tapOn:
    id: scoreImport.display.staff
- scrollUntilVisible:
    element:
      id: scoreImport.start
    direction: DOWN
- tapOn:
    id: scoreImport.start
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- assertVisible:
    id: practice.tutorial
- tapOn:
    id: practice.tutorial
- extendedWaitUntil:
    visible:
      id: practice.rhythmDisplay
    timeout: 10000
- assertVisible:
    id: practice.barsRemaining
- assertVisible:
    id: practice.scoreMeasure
- assertVisible:
    id: practice.scoreMeasure.bar.0.leftNotation
- assertVisible:
    id: practice.scoreMeasure.bar.0.leftNotation.note.0
- assertVisible:
    id: practice.scoreMeasure.bar.0.rightNotation
- assertVisible:
    id: practice.scoreMeasure.bar.0.rightNotation.note.0
- assertVisible:
    id: practice.scoreMeasure.bar.1.leftNotation.note.0
- assertVisible:
    id: practice.scoreMeasure.bar.1.rightNotation.note.0
- assertNotVisible:
    id: practice.scoreMeasure.bar.2.leftNotation.note.0
- assertVisible:
    id: practice.tap.left.label
- assertVisible:
    id: practice.tap.right.label
- assertNotVisible:
    id: practice.scoreHand.left
- tapOn:
    id: practice.tap.left
- tapOn:
    id: practice.tap.right
- extendedWaitUntil:
    visible: "1 bar remaining"
    timeout: 15000
- tapOn:
    id: practice.pause
- assertVisible: PAUSED
- assertVisible: 1 BAR BACK
- tapOn:
    id: practice.pause.rewind
- assertNotVisible: PAUSED
- extendedWaitUntil:
    visible:
      id: results.screen
    timeout: 15000
- assertVisible: SCORE SESSION COMPLETE
- assertVisible: 60 BPM · 2/4 · E2E Two Bar Score
