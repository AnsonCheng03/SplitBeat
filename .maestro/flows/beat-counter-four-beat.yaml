appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: tutorial.overlay
    timeout: 15000
- longPressOn:
    id: tutorial.holdToSkip
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- tapOn:
    id: home.setup
- assertVisible:
    id: setup.screen
- tapOn:
    id: setup.card.rhythm
- assertVisible:
    id: settings.rhythm.screen
- tapOn:
    id: setup.timeSignature.4-4
- tapOn:
    id: settings.rhythm.back
- tapOn:
    id: setup.home
- tapOn:
    id: home.start
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- tapOn:
    id: practice.tutorial
- extendedWaitUntil:
    visible:
      id: practice.beatPosition
      text: Beat 4 of 4
    timeout: 15000
- assertVisible:
    id: practice.beatDot.1
- assertVisible:
    id: practice.beatDot.2
- assertVisible:
    id: practice.beatDot.3
- assertVisible:
    id: practice.beatDot.4
- assertNotVisible:
    id: practice.beatDot.5
- takeScreenshot: beat-counter-four-beat
