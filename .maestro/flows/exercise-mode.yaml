appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: tutorial.overlay
    timeout: 15000
- tapOn:
    id: tutorial.skip
- tapOn:
    id: home.activityPicker
- tapOn:
    id: home.exercise
- tapOn:
    id: home.start
- assertVisible:
    id: exercise.screen
- tapOn:
    id: exercise.tab.bar
- assertVisible: COMPOSE A SCORE
- tapOn:
    id: exercise.composer.mode.rest
- tapOn:
    id: exercise.composer.symbol.whole
- assertVisible:
    id: exercise.composer.timeline
- tapOn:
    id: exercise.composer.hand.right
- tapOn:
    id: exercise.composer.mode.note
- tapOn:
    id: exercise.composer.symbol.whole
- assertVisible:
    id: exercise.composer.preview.1.leftNotation
- tapOn:
    id: exercise.composer.symbol.whole
- assertVisible: 2 bars
- scrollUntilVisible:
    element:
      id: exercise.saveComposition
    direction: DOWN
- tapOn:
    id: exercise.saveComposition
- assertVisible:
    id: exercise.composition.*
- scrollUntilVisible:
    element:
      id: exercise.practiceBar
    direction: DOWN
- tapOn:
    id: exercise.practiceBar
- assertVisible:
    id: exercise.preparing
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- assertVisible:
    id: practice.tutorial
- tapOn:
    id: practice.tutorial
- assertVisible:
    id: practice.beatCounter
- tapOn:
    id: practice.pause
- assertVisible: PAUSED
- tapOn:
    id: practice.pause.finish
- extendedWaitUntil:
    visible:
      id: results.screen
    timeout: 15000
- assertVisible: SCORE SESSION COMPLETE
