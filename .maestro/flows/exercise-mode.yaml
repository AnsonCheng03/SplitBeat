appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: tutorial.overlay
    timeout: 15000
- longPressOn:
    id: tutorial.holdToSkip
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- tapOn:
    id: home.activityPicker
- tapOn:
    id: home.exercise
- assertVisible:
    id: home.start
- waitForAnimationToEnd
- tapOn:
    id: home.start
- extendedWaitUntil:
    visible:
      id: exercise.screen
    timeout: 15000
- tapOn:
    id: exercise.tab.bar
- assertVisible: COMPOSE A SCORE
- tapOn:
    id: exercise.composer.mode.rest
- tapOn:
    id: exercise.composer.symbol.whole
- scrollUntilVisible:
    element:
      id: exercise.composer.timeline
    direction: DOWN
- assertVisible:
    id: exercise.composer.timeline
- scrollUntilVisible:
    element:
      id: exercise.composer.hand.right
    direction: UP
- tapOn:
    id: exercise.composer.hand.right
- tapOn:
    id: exercise.composer.mode.note
- tapOn:
    id: exercise.composer.symbol.whole
- scrollUntilVisible:
    element:
      id: exercise.composer.preview.1.leftNotation
    direction: DOWN
- assertVisible:
    id: exercise.composer.preview.1.leftNotation
- scrollUntilVisible:
    element:
      id: exercise.composer.symbol.whole
    direction: UP
- tapOn:
    id: exercise.composer.symbol.whole
- scrollUntilVisible:
    element:
      text: 2 bars
    direction: DOWN
- assertVisible: 2 bars
- scrollUntilVisible:
    element:
      id: exercise.saveComposition
    direction: DOWN
- tapOn:
    id: exercise.saveComposition
- assertVisible:
    id: exercise.composition.*
- scrollUntilVisible:
    element:
      id: exercise.practiceBar
    direction: DOWN
- tapOn:
    id: exercise.practiceBar
- assertVisible:
    id: exercise.preparing
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- assertVisible:
    id: practice.tutorial
- tapOn:
    id: practice.tutorial
- extendedWaitUntil:
    visible:
      id: practice.beatCounter
    timeout: 5000
- tapOn:
    id: practice.pause
- assertVisible: PAUSED
- tapOn:
    id: practice.pause.finish
- extendedWaitUntil:
    visible:
      id: results.screen
    timeout: 15000
- assertVisible: SCORE SESSION COMPLETE
