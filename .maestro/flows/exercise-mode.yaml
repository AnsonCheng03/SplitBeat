appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- tapOn:
    id: home.exercise
- assertVisible:
    id: exercise.screen
- tapOn:
    id: exercise.tab.bar
- assertVisible:
    id: exercise.leftBar
- assertVisible:
    id: exercise.rightBar
- scrollUntilVisible:
    element:
      id: exercise.practiceBar
    direction: DOWN
- tapOn:
    id: exercise.practiceBar
- extendedWaitUntil:
    visible:
      id: practice.screen
    timeout: 15000
- assertVisible:
    id: practice.tutorial
- tapOn:
    id: practice.tutorial
- assertVisible:
    id: practice.beatCounter
- tapOn:
    id: practice.pause
- assertVisible:
    id: practice.pauseMenu
- tapOn:
    id: practice.pause.finish
- extendedWaitUntil:
    visible:
      id: results.screen
    timeout: 15000
- assertVisible: SCORE SESSION COMPLETE
