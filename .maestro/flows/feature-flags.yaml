appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- tapOn:
    id: home.setup
- assertVisible:
    id: setup.screen
- tapOn:
    id: setup.card.features
- assertVisible:
    id: settings.features.screen
- extendedWaitUntil:
    visible:
      text: 22 of 22 enabled
    timeout: 10000
- assertVisible:
    id: feature.scoreImport
- scrollUntilVisible:
    element:
      id: feature.backgroundMusic
    direction: DOWN
- assertVisible:
    id: feature.backgroundMusic
- scrollUntilVisible:
    element:
      id: feature.gameCenter
    direction: DOWN
- assertVisible:
    id: feature.gameCenter
- tapOn:
    id: feature.gameCenter
- scrollUntilVisible:
    element:
      id: feature.backgroundMusic
    direction: UP
- assertVisible:
    id: feature.backgroundMusic
- tapOn:
    id: feature.backgroundMusic
- scrollUntilVisible:
    element:
      id: settings.features.enableAll
    direction: UP
- tapOn:
    id: settings.features.enableAll
- assertVisible:
    text: 22 of 22 enabled
