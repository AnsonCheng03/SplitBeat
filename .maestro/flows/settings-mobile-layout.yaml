appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: Two-Hand Rhythm Trainer
    commands:
      - tapOn: Two-Hand Rhythm Trainer
- runFlow:
    when:
      visible:
        text: Open
    commands:
      - tapOn: Open
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- tapOn:
    id: home.setup
- extendedWaitUntil:
    visible:
      id: setup.screen
    timeout: 10000
- tapOn:
    id: setup.card.rhythm
- assertVisible:
    id: settings.rhythm.screen
- assertVisible:
    id: setup.card.rhythm
    selected: true
- assertVisible:
    id: setup.card.audio
- assertVisible:
    id: setup.card.appearance
- assertVisible:
    id: setup.card.challenges
- assertNotVisible:
    id: settings.challenges.gameCenter
- tapOn:
    id: setup.card.challenges
- assertVisible:
    id: settings.challenges.screen
- scrollUntilVisible:
    element:
      id: settings.challenges.gameCenter
    direction: DOWN
- assertVisible:
    id: settings.challenges.gameCenter
- takeScreenshot: settings-challenges
- tapOn:
    id: setup.card.audio
- assertVisible:
    id: settings.audio.screen
- tapOn:
    id: setup.card.appearance
- assertVisible:
    id: settings.appearance.screen
- assertVisible:
    id: settings.appearance.lightMode
- assertNotVisible:
    id: settings.appearance.display.rhythm
- takeScreenshot: settings-mobile-landscape
- tapOn:
    id: setup.card.language
- assertVisible:
    id: settings.language.screen
- assertVisible:
    id: settings.language.choice.system
- assertVisible:
    id: settings.language.screen
- assertNotVisible:
    id: settings.navigation
- assertVisible:
    id: setup.card.language
- takeScreenshot: settings-mobile-landscape
