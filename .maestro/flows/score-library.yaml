appId: com.splitbeat.twohandrhythm
---
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    clearState: true
- runFlow:
    when:
      visible:
        text: Two-Hand Rhythm Trainer
    commands:
      - tapOn: Two-Hand Rhythm Trainer
- runFlow:
    when:
      visible:
        text: Open
    commands:
      - tapOn: Open
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: tutorial.overlay
    timeout: 15000
- tapOn:
    id: tutorial.skip
- tapOn:
    id: home.activityPicker
- tapOn:
    id: home.importScore
- extendedWaitUntil:
    visible:
      id: scoreImport.screen
    timeout: 15000
- tapOn:
    id: scoreImport.category.pop
- scrollUntilVisible:
    element:
      id: scoreImport.template.pop-groove-difficult-duet
    direction: DOWN
- assertVisible:
    id: scoreImport.template.pop-groove-difficult-duet
- assertNotVisible:
    id: scoreImport.template.jingle-bells-easy-duet
- scrollUntilVisible:
    element:
      id: scoreImport.tag.difficult
    direction: UP
- tapOn:
    id: scoreImport.tag.difficult
- scrollUntilVisible:
    element:
      id: scoreImport.template.pop-groove-difficult-duet
    direction: DOWN
- assertVisible:
    id: scoreImport.template.pop-groove-difficult-duet
- scrollUntilVisible:
    element:
      id: scoreImport.category.classical
    direction: UP
- tapOn:
    id: scoreImport.category.classical
- scrollUntilVisible:
    element:
      id: scoreImport.template.fur-elise-difficult-one-hand
    direction: DOWN
- assertVisible:
    id: scoreImport.template.fur-elise-difficult-one-hand
- scrollUntilVisible:
    element:
      id: scoreImport.filters.clear
    direction: UP
- tapOn:
    id: scoreImport.filters.clear
- scrollUntilVisible:
    element:
      id: scoreImport.template.jingle-bells-easy-duet
    direction: DOWN
- assertVisible:
    id: scoreImport.template.jingle-bells-easy-duet
- tapOn:
    id: scoreImport.tag.both-hands
- assertVisible:
    id: scoreImport.template.jingle-bells-easy-duet
- assertNotVisible:
    id: scoreImport.template.fur-elise-difficult-one-hand
- tapOn:
    id: scoreImport.filters.clear
- tapOn:
    id: scoreImport.template.jingle-bells-easy-duet
- assertVisible:
    id: scoreImport.summary
- tapOn:
    id: scoreImport.save
- assertVisible: Remove score from saved scores
- scrollUntilVisible:
    element: { id: scoreImport.library }
    direction: DOWN
- tapOn:
    id: scoreImport.library
- scrollUntilVisible:
    element:
      id: scoreImport.saved.heading
    direction: DOWN
- assertVisible:
    id: scoreImport.saved.heading
- tapOn:
    id: scoreImport.saved.entry.*
- assertVisible:
    id: scoreImport.summary
